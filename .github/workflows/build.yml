name: OpenWrt Snapshot Build for Jio AX6000 (JIDU6J11)

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if nothing changed"
        type: boolean
        default: false
  schedule:
    - cron: "30 20 * * *" # 02:00 IST, daily

permissions:
  contents: write

env:
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git
  OPENWRT_BRANCH: main
  PR_NUMBER: "26498" # upstream PR with the device support; set to "" once merged
  IWINFO_PRS: "51" # open openwrt/iwinfo PRs to patch in (space-separated); set to "" once merged
  TARGET: qualcommbe
  SUBTARGET: ipq95xx
  SKUS: "6111 6411 6611 6711 6811 6911"
  EXPECTED_DEVICES: "6" # prepare.sh fails if .config does not enable exactly this many profiles
  KEEP_RELEASES: "7"

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      hash: ${{ steps.check.outputs.hash }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Decide whether a build is needed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          up=$(git ls-remote "$OPENWRT_REPO" "refs/heads/$OPENWRT_BRANCH" | cut -f1)
          pr=""
          if [ -n "$PR_NUMBER" ]; then
            pr=$(git ls-remote "$OPENWRT_REPO" "refs/pull/$PR_NUMBER/head" | cut -f1)
          fi
          iw=""
          for n in $IWINFO_PRS; do
            iw="$iw $(git ls-remote https://github.com/openwrt/iwinfo "refs/pull/$n/head" | cut -f1)"
          done
          own=$(git ls-tree -r HEAD -- config patches files bdf feeds.conf.default.d scripts | sha256sum | cut -d' ' -f1)
          hash=$(echo "$up $pr $iw $own" | sha256sum | cut -c1-16)

          last=$(gh release view --json body -q .body 2>/dev/null | grep -oP 'Build-Hash: \K\w+' || true)
          echo "current=$hash last=$last"

          if [ "$hash" != "$last" ] || [ "$FORCE" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force > /dev/null
        df -h /

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gettext git \
          libncurses-dev libssl-dev python3-setuptools python3-pyelftools rsync swig \
          unzip zlib1g-dev file wget libelf-dev ccache tree

    - name: Restore caches
      uses: actions/cache/restore@v4
      with:
        path: |
          cache/dl
          cache/ccache
        key: build-cache-${{ github.run_id }}
        restore-keys: build-cache-

    - name: Prepare tree
      run: bash scripts/prepare.sh

    - name: Download sources
      working-directory: openwrt
      run: make download -j8

    - name: Build
      working-directory: openwrt
      run: make -j"$(($(nproc) + 1))" || make -j1 V=s

    - name: Save caches
      if: always()
      uses: actions/cache/save@v4
      with:
        path: |
          cache/dl
          cache/ccache
        key: build-cache-${{ github.run_id }}

    - name: Build Summary
      if: always()
      run: |
        cd openwrt

        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  🖥️  Runner Info"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  OS      : $(lsb_release -ds)"
        echo "  CPU     : $(nproc) cores"
        echo "  RAM     : $(free -h | awk '/^Mem/{print $2}') total / $(free -h | awk '/^Mem/{print $7}') available"
        echo "  Disk    : $(df -h . | awk 'NR==2{print $4}') free of $(df -h . | awk 'NR==2{print $2}')"

        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  🎯 Build Target"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  Target  : $(grep 'CONFIG_TARGET_BOARD' .config | cut -d= -f2 | tr -d '\"')"
        echo "  Subtarget: $(grep 'CONFIG_TARGET_SUBTARGET' .config | cut -d= -f2 | tr -d '\"')"
        echo "  Devices :"
        grep -E '^CONFIG_TARGET_DEVICE_.*=y' .config | sed -E 's/.*_DEVICE_(.*)=y/    - \1/'

        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  📜 Git Commits (last 5)"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        git log --oneline -5

        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  📦 Build Artifacts"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        ls -1 bin/targets/$TARGET/$SUBTARGET/ 2>/dev/null || true

        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  📏 Image Sizes"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        ls -lh bin/targets/$TARGET/$SUBTARGET/*sysupgrade* bin/targets/$TARGET/$SUBTARGET/*initramfs* 2>/dev/null | awk '{print "  " $5 "  " $9}' || true

        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  📦 Selected Packages Count"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  Total   : $(grep '^CONFIG_PACKAGE_.*=y' .config | wc -l) packages"

        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  📊 ccache Stats"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        staging_dir/host/bin/ccache -vv --show-stats || true

        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  🌐 Feeds"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        cat feeds.conf

        echo ""

    - name: Collect artifacts
      run: |
        d=openwrt/bin/targets/$TARGET/$SUBTARGET
        mkdir out
        find "$d" -maxdepth 1 -type f \
          \( -name '*sysupgrade*' -o -name '*initramfs*' \) \
          -exec cp {} out/ \;
        ls -lh out

    - name: Publish release
      env:
        GH_TOKEN: ${{ github.token }}
        HASH: ${{ needs.check.outputs.hash }}
      run: |
        bash scripts/gen-release-notes.sh out > release-notes.md
        (cd out && sha256sum * > sha256sums)

        tag="snapshot-$(date -u +%Y%m%d)"
        gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
        gh release create "$tag" out/* \
          --title "Snapshot $(date -u +%Y-%m-%d)" \
          --notes-file release-notes.md

        gh release list --limit 100 --json tagName -q '.[].tagName' \
          | grep '^snapshot-' | sort -r | tail -n +"$((KEEP_RELEASES + 1))" \
          | xargs -r -I{} gh release delete {} --yes --cleanup-tag